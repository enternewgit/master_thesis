services:
  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      FRONTEND_URL: "http://localhost:3001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  frontend:
    build: ./frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend