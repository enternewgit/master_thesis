    "passlib==1.7.4",
    "pillow==11.3.0",
    "platformdirs==4.5.1",
    "pooch==1.8.2",
    "pycparser==2.23",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.12.0",
    "pyjwt==2.10.1",
    "pymongo==4.15.5",
    "pyparsing==3.2.5",
    "python-dateutil==2.9.0.post0",
    "python-decouple==3.8",
    "python-dotenv==1.2.1",
    "pytz==2025.2",
