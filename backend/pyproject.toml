[project]
name = "word-haku-api"
version = "0.1.0"
description = ""
authors = [{ name = "aueno" }]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.14",
    "uvicorn[standard]==0.29.0",
    "motor==3.7.1",
    "pydantic==2.12.5",
    "passlib==1.7.4",
    "python-decouple==3.8",
    "pyjwt==2.10.1",
    "bcrypt==4.3.0",
    "fastapi-csrf-protect==0.3.7",
    "tqdm==4.67.1",
    "seaborn==0.13.2",
    "braindecode==0.8.1",
    "numpy==1.26.4",
    "soundfile==0.13.1",
    "requests==2.32.5",
    "httpx==0.28.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "torchvision==0.24.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["word_haku_api"]

[tool.uv]
no-build-isolation-package = ["mamba-ssm"]
# Python 3.13 + pandas 2.0.2 is not a compatible build pair; the old pandas
# release crashes while compiling against the newer NumPy/Cython stack. Keep a
# Python-3.13-compatible release pinned here and the setuptools guard remains
# as a safety net for older legacy build paths.
extra-build-dependencies = { pandas = ["setuptools<81"] }
# Pin the full transitive dependency tree to the versions recorded in the
# previous poetry.lock so migrating to uv does not silently upgrade it.
constraint-dependencies = [
    "absl-py==2.3.1",
    "annotated-types==0.7.0",
    "anyio==4.12.0",
    "bcrypt==4.3.0",
    "braindecode==0.8.1",
    "certifi==2025.11.12",
    "cffi==2.0.0",
    "charset-normalizer==3.4.4",
    "click==8.3.1",
    "colorama==0.4.6",
    "contourpy==1.3.3",
    "cycler==0.12.1",
    "decorator==5.2.1",
    "dnspython==2.8.0",
    "docstring-inheritance==2.3.0",
    "einops==0.8.1",
    "fastapi==0.115.14",
    "fastapi-csrf-protect==0.3.7",
    "filelock==3.20.0",
    "fonttools==4.61.0",
    "fsspec==2025.12.0",
    "h11==0.16.0",
    "h5py==3.15.1",
    "httpcore==1.0.9",
    "httpx==0.28.1",
    "idna==3.11",
    "itsdangerous==2.2.0",
    "jinja2==3.1.6",
