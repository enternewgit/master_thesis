    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "seaborn==0.13.2",
    "setuptools==80.9.0",
    "six==1.17.0",
    "skorch==1.3.0",
    "soundfile==0.13.1",
    "starlette==0.46.2",
    "sympy==1.14.0",
